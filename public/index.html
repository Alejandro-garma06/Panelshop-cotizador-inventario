#panelshop-inventario{--ps-bg:light-dark(#f4f6f8,#141b24);--ps-surface:light-dark(#fff,#1c2632);--ps-ink:light-dark(#172a3b,#eef4fa);--ps-muted:light-dark(#617384,#a5b4c4);--ps-line:light-dark(#e3e9ee,#344351);--ps-teal:light-dark(#007f82,#73d9d0);--ps-tealtext:light-dark(#fff,#0a2429);--ps-soft:light-dark(#eaf7f6,#183e43);--ps-side:light-dark(#183144,#172b3a);--ps-sideink:#eaf3f8;--ps-warn:light-dark(#8d5918,#eec178);--ps-warnbg:light-dark(#fff4dc,#403421);--ps-danger:light-dark(#ab3444,#ffadba);--ps-dangerbg:light-dark(#fdeef0,#462a34);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;color:var(--ps-ink);color-scheme:light dark}
